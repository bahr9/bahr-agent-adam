[pytest]
# أمر تشغيل الاختبارات: `pytest`
#
# قبل 2026-08-09 ماكانش فيه ملف إعداد ولا أمر موثّق في الريبو، و`pytest`
# المجرّد كان بيجمّع **7 ملفات من 56** ويعدي على الباقي في صمت كامل --
# من غير تحذير ولا سطر واحد. يعني كان بيقول "85 اختبار عدّى" وهو مغطّي
# 12% من شبكة الأمان. الاختبارات نفسها كانت سليمة (اتحقق بالتحوير:
# 56/56 بيحمرّوا لما تكسر الكود اللي بيحرسوه) -- المقطوع كان الوصلة
# بينها وبين الأداة اللي بتشغّلها.
#
# `conftest.py` هو الجسر: بيخلي pytest يشوف الملفات اللي اختباراتها جوه
# `main()`. والنتيجة دلوقتي 56 ملف و136 اختبار.
#
# التشغيل المباشر (`python test_x.py`) لسه شغال لكل ملف، وده مقصود --
# أسرع طريقة تشوف أنهي اختبار جوه الملف بالظبط هو اللي وقع.

testpaths = .
python_files = test_*.py

# -q: نتيجة مختصرة. الفشل بيطلع كامل برضه.
# -p no:cacheprovider: مفيش .pytest_cache في الريبو.
#
# ⚠️ ممنوع تحط `-m "not ..."` هنا. الافتراضي لازم يشغّل **كل حاجة**،
#    وفيه اختبار بيحرس الشرط ده (شوف test_zz_no_pollution.py). السبب هو
#    نفس حادثة النهاردة: الاستبعاد الصامت أخطر من البطء.
addopts = -q -p no:cacheprovider

markers =
    live: بينده Claude API فعليًا -- فلوس ووقت حقيقيين، ونتيجته بتعتمد
        على سلوك موديل مش بنتحكم فيه. الاختبارات دي بتمسك نوع عيب مفيش
        موك بيمسكه: إن آدم **فعلًا** بيختار الأداة الصح بالبرومبت الحالي
        (حادثة 2026-07-27 كانت بالظبط كده -- تعليمة قديمة في البرومبت
        منعت الموديل يشوف أداة اتبنت بعدها).

# =====================================================================
# الأمرين
# =====================================================================
#   pytest                 كل حاجة. 136 اختبار، ~90 ثانية، ~$0.13.
#                          ده الأمر الحقيقي -- اللي تصدّقه قبل ما تشحن.
#
#   pytest -m "not live"   من غير النداءات الحية. ~24 ثانية، صفر تكلفة.
#                          للتكرار السريع وانت بتشتغل. pytest بيطبع
#                          "N deselected" فانت شايف اللي استبعدته.
#
# العلامة موجودة عشان **تقدر تختار**، مش عشان الأداة تختار عنك. الفرق
# ده هو كل الشغلانة: `pytest` قبل النهاردة كان بيستبعد 49 ملف من غير ما
# يقول، وده اللي خلّى "85 عدّى" رقم بلا معنى.

# صمت التحذيرات المعروفة من مكتبة supabase (deprecated params في عميلها
# الداخلي) -- مش بتاعتنا ومش بتخفي أي فشل.
filterwarnings =
    ignore:The 'timeout' parameter is deprecated:DeprecationWarning
    ignore:The 'verify' parameter is deprecated:DeprecationWarning
