[pytest]
# أمر تشغيل الاختبارات: `pytest`
#
# قبل 2026-08-09 ماكانش فيه ملف إعداد ولا أمر موثّق في الريبو، و`pytest`
# المجرّد كان بيجمّع **7 ملفات من 56** ويعدي على الباقي في صمت كامل --
# من غير تحذير ولا سطر واحد. يعني كان بيقول "85 اختبار عدّى" وهو مغطّي
# 12% من شبكة الأمان. الاختبارات نفسها كانت سليمة (اتحقق بالتحوير:
# 56/56 بيحمرّوا لما تكسر الكود اللي بيحرسوه) -- المقطوع كان الوصلة
# بينها وبين الأداة اللي بتشغّلها.
#
# `conftest.py` هو الجسر: بيخلي pytest يشوف الملفات اللي اختباراتها جوه
# `main()`. والنتيجة دلوقتي 56 ملف و136 اختبار.
#
# التشغيل المباشر (`python test_x.py`) لسه شغال لكل ملف، وده مقصود --
# أسرع طريقة تشوف أنهي اختبار جوه الملف بالظبط هو اللي وقع.

testpaths = .
python_files = test_*.py

# -q: نتيجة مختصرة. الفشل بيطلع كامل برضه.
# -p no:cacheprovider: مفيش .pytest_cache في الريبو.
addopts = -q -p no:cacheprovider

# صمت التحذيرات المعروفة من مكتبة supabase (deprecated params في عميلها
# الداخلي) -- مش بتاعتنا ومش بتخفي أي فشل.
filterwarnings =
    ignore:The 'timeout' parameter is deprecated:DeprecationWarning
    ignore:The 'verify' parameter is deprecated:DeprecationWarning
